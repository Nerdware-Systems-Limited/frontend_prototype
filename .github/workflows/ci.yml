name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tests/integration/live.test.ts needs a running Django backend, which CI doesn't have.
      - run: npm test
        env:
          UAPTS_SKIP_LIVE: '1'
